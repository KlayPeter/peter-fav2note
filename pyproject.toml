[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fav2note"
version = "0.1.0"
description = "把小红书 / 抖音的收藏，转成带截图和时间码的本地知识库（Obsidian 可直接打开）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KlayPeter" }]
keywords = ["obsidian", "knowledge-base", "xiaohongshu", "douyin", "whisper", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "openai>=1.40",
    "rich>=13.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
ocr = ["rapidocr-onnxruntime>=1.4"]
browser = ["playwright>=1.44"]
web = ["fastapi>=0.110", "uvicorn>=0.30"]
all = ["faster-whisper>=1.0", "rapidocr-onnxruntime>=1.4", "playwright>=1.44", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
fav2note = "fav2note.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fav2note"]

[tool.ruff]
line-length = 100
target-version = "py310"
