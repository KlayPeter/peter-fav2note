<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fav2note</title>
<style>
  :root{
    --bg:#f6f6f4; --panel:#fff; --line:#e4e4e0; --ink:#1b1b19; --sub:#71716c;
    --accent:#2f6f4f; --accent-soft:#eef5f0; --warn:#a33b2b; --warn-soft:#fdf3f1;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;overflow:hidden;
  }
  /* 侧栏 */
  aside{
    width:196px;flex:0 0 196px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 12px;
  }
  .brand{font-weight:650;font-size:15px;letter-spacing:.2px;padding:4px 8px 14px}
  .brand small{display:block;color:var(--sub);font-weight:400;font-size:11px;letter-spacing:.4px}
  nav{display:flex;flex-direction:column;gap:2px}
  nav a{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    color:#3a3a36;text-decoration:none;font-size:13px;
  }
  nav a:hover{background:#f3f3f0}
  nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
  .side-foot{margin-top:auto;padding:10px 8px;color:var(--sub);font-size:11px;line-height:1.5}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c9c9c4;margin-right:6px}
  .dot.on{background:#39a06a}

  /* 主区 */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{
    height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  header h1{font-size:14px;font-weight:600;margin:0}
  header .actions{display:flex;gap:8px}
  button{
    font:inherit;font-size:13px;padding:6px 13px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:.15s;
  }
  button:hover{border-color:#cfcfc9;background:#fafaf8}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#285f43}
  button:disabled{opacity:.45;cursor:not-allowed}
  .content{flex:1;overflow:auto;padding:22px 24px 48px}

  /* 卡片 / 表格 */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card .k{color:var(--sub);font-size:12px}
  .card .v{font-size:24px;font-weight:640;margin-top:2px;letter-spacing:-.3px}
  .card .h{color:var(--sub);font-size:11px;margin-top:2px}
  h2.sec{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{background:#fbfbf9;color:var(--sub);font-weight:500;font-size:12px}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fbfbf9}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
  .tag.done{color:var(--accent);border-color:#cfe3d8;background:var(--accent-soft)}
  .tag.failed{color:var(--warn);border-color:#eed6d1;background:var(--warn-soft)}
  .tag.skip{color:#8a6d1f;border-color:#eadfc4;background:#fbf6e9}
  .empty{color:var(--sub);text-align:center;padding:26px}

  /* 表单 */
  .field{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:none}
  .field label{width:140px;flex:0 0 140px;color:#3a3a36;font-size:13px;padding-top:6px}
  .field .desc{color:var(--sub);font-size:12px;margin-top:4px}
  input[type=text],input[type=password],input[type=number]{
    width:100%;max-width:420px;font:inherit;font-size:13px;padding:7px 10px;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  }
  input:focus{outline:2px solid var(--accent-soft);border-color:#b9cfc2}

  /* 日志 */
  .log{
    background:#161615;color:#d5d5cf;border-radius:var(--radius);padding:12px 14px;
    font:12px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace;
    height:210px;overflow:auto;white-space:pre-wrap;margin:0;
  }
  .bar{height:3px;background:#ecece8;border-radius:2px;overflow:hidden;margin-bottom:14px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  .toast{
    position:fixed;right:22px;bottom:22px;background:#1b1b19;color:#fff;padding:10px 14px;
    border-radius:8px;font-size:13px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .row{display:flex;gap:10px;align-items:center}
  .muted{color:var(--sub)}
  .hidden{display:none !important}
</style>
</head>
<body>
<aside>
  <div class="brand">fav2note<small>收藏转知识库</small></div>
  <nav>
    <a href="#overview" data-view="overview" class="active">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      概览
    </a>
    <a href="#items" data-view="items">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      采集清单
    </a>
    <a href="#notes" data-view="notes">
      <svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>
      笔记库
    </a>
    <a href="#settings" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L6 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4L19 13z"/></svg>
      设置
    </a>
  </nav>
  <div class="side-foot"><span class="dot" id="status-dot"></span><span id="status-text">空闲</span></div>
</aside>

<main>
  <header>
    <h1 id="page-title">概览</h1>
    <div class="actions" id="page-actions"></div>
  </header>
  <div class="content">

    <!-- 概览 -->
    <section id="view-overview">
      <div class="cards">
        <div class="card"><div class="k">知识库笔记</div><div class="v" id="c-notes">-</div><div class="h" id="c-platform"></div></div>
        <div class="card"><div class="k">已处理</div><div class="v" id="c-done">-</div><div class="h">含跳过与图文</div></div>
        <div class="card"><div class="k">失败</div><div class="v" id="c-failed">-</div><div class="h">可重试</div></div>
        <div class="card"><div class="k">待处理</div><div class="v" id="c-pending">-</div><div class="h">采集后进入队列</div></div>
      </div>
      <div class="panel" id="account-tip" style="padding:10px 14px;font-size:12px;color:var(--sub)">正在检查账号状态…</div>
      <h2 class="sec">任务进度</h2>
      <div class="bar"><i id="progress"></i></div>
      <pre class="log" id="log">空闲中</pre>
    </section>

    <!-- 采集清单 -->
    <section id="view-items" class="hidden">
      <div class="panel">
        <table>
          <thead><tr>
            <th style="width:34px"><input type="checkbox" id="chk-all" title="全选" /></th>
            <th style="width:44%">标题</th><th>平台</th><th>类型</th><th>状态</th>
          </tr></thead>
          <tbody id="items-body"><tr><td colspan="5" class="empty">还没有采集结果</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- 笔记库 -->
    <section id="view-notes" class="hidden">
      <div class="panel">
        <table>
          <thead><tr><th style="width:50%">标题</th><th>平台</th><th>分类</th></tr></thead>
          <tbody id="notes-body"><tr><td colspan="3" class="empty">还没有笔记</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- 设置 -->
    <section id="view-settings" class="hidden">
      <div class="panel">
        <div class="field">
          <label>API Key</label>
          <div style="flex:1">
            <input type="password" id="f-key" placeholder="留空则不修改" />
            <div class="desc">存在本地 .env，不会上传。当前：<span id="key-state" class="muted">未配置</span></div>
          </div>
        </div>
        <div class="field">
          <label>Base URL</label>
          <div style="flex:1"><input type="text" id="f-base" placeholder="https://api.deepseek.com/v1" /></div>
        </div>
        <div class="field">
          <label>模型</label>
          <div style="flex:1"><input type="text" id="f-model" placeholder="deepseek-chat" /></div>
        </div>
        <div class="field">
          <label>截图数量</label>
          <div style="flex:1">
            <div class="row">
              <input type="number" id="f-frames-min" min="1" max="20" style="max-width:90px" />
              <span class="muted">至</span>
              <input type="number" id="f-frames-max" min="1" max="20" style="max-width:90px" />
              <span class="muted">张</span>
            </div>
            <div class="desc">按分节数自动取值，落在这个区间内。建议 3–10。</div>
          </div>
        </div>
        <div class="field">
          <label>定时更新</label>
          <div style="flex:1">
            <div class="row">
              <input type="checkbox" id="f-sched-enabled" />
              <span>启用</span>
              <input type="number" id="f-sched-every" min="15" step="15" style="max-width:100px" />
              <span class="muted">分钟一次</span>
            </div>
            <div class="desc">到点自动采集两个平台并处理未完成条目（增量）。上次：<span id="sched-last" class="muted">—</span></div>
          </div>
        </div>
        <div class="field">
          <label></label>
          <div style="flex:1"><button class="primary" id="btn-save">保存</button></div>
        </div>
      </div>
      <p class="muted" style="font-size:12px">修改后需重启面板生效。</p>
    </section>

  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { view: "overview", running: false, selected: new Set() };

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 路由 */
const TITLES = { overview: "概览", items: "采集清单", notes: "笔记库", settings: "设置" };
function go(view) {
  state.view = view;
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.view === view));
  ["overview", "items", "notes", "settings"].forEach((name) => {
    $("view-" + name).classList.toggle("hidden", name !== view);
  });
  $("page-title").textContent = TITLES[view];
  renderActions();
  if (view === "items") loadItems();
  if (view === "notes") loadNotes();
  if (view === "settings") loadSettings();
}
window.addEventListener("hashchange", () => go(location.hash.slice(1) || "overview"));

function renderActions() {
  const box = $("page-actions");
  box.innerHTML = "";
  const add = (label, cls, handler) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (cls) b.className = cls;
    b.disabled = state.running;
    b.onclick = handler;
    box.appendChild(b);
  };
  if (state.view === "overview") {
    add("采集小红书", "", () => start("/api/collect?source=xhs&limit=100", "开始采集小红书"));
    add("采集抖音", "", () => start("/api/collect?source=douyin&limit=100", "开始采集抖音"));
    add("开始处理", "primary", () => start("/api/run?limit=20", "开始处理队列"));
  }
  if (state.view === "items") {
    add("采集小红书", "", () => start("/api/collect?source=xhs&limit=100", "开始采集小红书"));
    add("采集抖音", "", () => start("/api/collect?source=douyin&limit=100", "开始采集抖音"));
    add(`处理选中 (${state.selected.size})`, "primary", startSelected);
  }
  if (state.view === "notes") {
    add("重建关联", "", () => start("/api/link", "开始重建关联"));
    add("刷新", "primary", refreshAll);
    return;
  }
  add("刷新", "primary", refreshAll);
}

async function startSelected() {
  const keys = [...state.selected];
  if (!keys.length) {
    toast("先在列表里勾选要处理的条目");
    return;
  }
  try {
    await api("/api/run?limit=0", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keys }),
    });
    toast(`开始处理 ${keys.length} 条`);
    setTimeout(refreshAll, 800);
  } catch (e) {
    toast("启动失败：" + e.message);
  }
}

$("chk-all").addEventListener("change", (event) => {
  const boxes = document.querySelectorAll(".chk-item");
  boxes.forEach((box) => {
    box.checked = event.target.checked;
    event.target.checked ? state.selected.add(box.dataset.key) : state.selected.delete(box.dataset.key);
  });
  renderActions();
});

async function start(url, message) {
  try {
    await api(url, { method: "POST" });
    toast(message);
    setTimeout(refreshAll, 800);
  } catch (e) {
    toast("启动失败：" + e.message);
  }
}

/* 数据 */
async function loadSummary() {
  const data = await api("/api/summary");
  $("c-notes").textContent = data.notes;
  $("c-done").textContent = data.counts.done || 0;
  $("c-failed").textContent = data.counts.failed || 0;
  $("c-pending").textContent = data.counts.pending || 0;
  $("c-platform").textContent = Object.entries(data.by_platform || {}).map(([k, v]) => `${k} ${v}`).join(" · ") || "—";

  const job = data.job;
  state.running = job.running;
  $("status-dot").className = "dot" + (job.running ? " on" : "");
  $("status-text").textContent = job.running ? job.name + " 运行中" : "空闲";
  $("log").textContent = job.log && job.log.length ? job.log.join("\n") : "空闲中";
  $("log").scrollTop = $("log").scrollHeight;
  $("progress").style.width = job.running ? Math.min(95, 20 + job.elapsed * 2) + "%" : "0%";
  renderActions();
}

async function loadItems() {
  const data = await api("/api/items?limit=300");
  const body = $("items-body");
  if (!data.items.length) {
    body.innerHTML = '<tr><td colspan="5" class="empty">还没有采集结果</td></tr>';
    return;
  }
  body.innerHTML = data.items.map((item) => {
    const key = `${item.platform}:${item.item_id}`;
    const checked = state.selected.has(key) ? "checked" : "";
    return `<tr>
      <td><input type="checkbox" class="chk-item" data-key="${escapeHtml(key)}" data-status="${escapeHtml(item.status)}" ${checked}></td>
      <td>${escapeHtml(item.title)}</td>
      <td>${escapeHtml(item.platform)}</td>
      <td>${escapeHtml(item.kind === "video" ? "视频" : "图文")}</td>
      <td><span class="tag ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span></td>
    </tr>`;
  }).join("");

  body.querySelectorAll(".chk-item").forEach((box) => {
    box.addEventListener("change", () => {
      box.checked ? state.selected.add(box.dataset.key) : state.selected.delete(box.dataset.key);
      renderActions();
    });
  });
  $("chk-all").checked = data.items.length > 0 && data.items.every((i) => state.selected.has(`${i.platform}:${i.item_id}`));
}

async function loadNotes() {
  const data = await api("/api/notes?limit=200");
  const body = $("notes-body");
  body.innerHTML = data.notes.length
    ? data.notes.map((n) => `<tr><td>${escapeHtml(n.title)}</td><td>${escapeHtml(n.platform)}</td><td>${escapeHtml(n.category)}</td></tr>`).join("")
    : '<tr><td colspan="3" class="empty">还没有笔记</td></tr>';
}

async function loadSettings() {
  const [data, schedule] = await Promise.all([api("/api/config"), api("/api/schedule")]);
  $("f-base").value = data.base_url || "";
  $("f-model").value = data.model || "";
  $("f-frames-min").value = data.frames_min ?? 3;
  $("f-frames-max").value = data.frames_max ?? 10;
  $("key-state").textContent = data.has_key ? "已配置" : "未配置";
  $("f-sched-enabled").checked = !!schedule.enabled;
  $("f-sched-every").value = schedule.every_minutes || 180;
  $("sched-last").textContent = schedule.last_run || "从未运行";
}

$("btn-save").onclick = async () => {
  const body = {
    api_key: $("f-key").value.trim(),
    base_url: $("f-base").value.trim(),
    model: $("f-model").value.trim(),
    frames_min: Number($("f-frames-min").value) || 3,
    frames_max: Number($("f-frames-max").value) || 10,
  };
  try {
    await api("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    await api("/api/schedule", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        enabled: $("f-sched-enabled").checked,
        every_minutes: Number($("f-sched-every").value) || 180,
      }),
    });
    toast("已保存");
    $("f-key").value = "";
    loadSettings();
  } catch (e) {
    toast("保存失败：" + e.message);
  }
};

function refreshAll() {
  loadSummary().catch((e) => toast(e.message));
  loadStatus().catch(() => {});
  if (state.view === "items") loadItems().catch(() => {});
  if (state.view === "notes") loadNotes().catch(() => {});
}

async function loadStatus() {
  const data = await api("/api/status");
  const douyin = data.douyin || {};
  const dy = douyin.ok
    ? `<span style="color:var(--accent)">抖音已登录</span>（${escapeHtml(douyin.checked_at || "")}）`
    : `<span style="color:var(--warn)">抖音未登录</span>，跑 <code>fav2note login --source douyin</code> 扫码`;
  const xhs = data.xhs_export
    ? `<span style="color:var(--accent)">小红书导出文件已就绪</span>`
    : `<span style="color:var(--warn)">小红书缺少导出文件</span>，用油猴脚本导出 fav_all.json 放进 inbox/`;
  $("account-tip").innerHTML = `${dy}　·　${xhs}`;
}

go(location.hash.slice(1) || "overview");
refreshAll();
setInterval(loadSummary, 3000);
</script>
</body>
</html>
